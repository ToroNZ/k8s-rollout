[package]
name = "k8s_rollout"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.28"
env_logger = "0.11.8"
anyhow = "1.0.100"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
kube = { version = "2.0.1", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.26.0", features = ["latest"] }
serde_json = "1.0"
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }
chrono = "0.4"
sha2 = "0.10"
