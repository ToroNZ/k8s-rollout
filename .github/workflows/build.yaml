name: 'Build image'

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
  push:
    paths-ignore:
      - '.github/**'
      - '.vscode/**'
    branches:
      - '*'
      - 'feature/**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches-ignore:
      - 'main'

env:
  REGISTRY: ghcr.io
  REPO: ${{ github.repository }}
  PACKAGE: k8s-rollout

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: set lower case owner name
        run: |
          echo "REPO_SOURCE=${REPO,,}" >>${GITHUB_ENV}
          echo "REPO_NAME=${{ github.event.repository.name }}" >> $GITHUB_ENV
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Inject slug/short variables
        uses: rlespinasse/github-slug-action@v5
        with:
          prefix: CI_

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.actor != 'dependabot' }}
          build-args: |
            GIT_COMMIT=${{ env.CI_GITHUB_SHA_SHORT}}
            GIT_BRANCH=${{ env.CI_GITHUB_REF_SLUG }}
            GIT_URL=${{ github.repositoryUrl }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_SOURCE }}/${{ env.PACKAGE }}:${{ env.CI_GITHUB_REF_SLUG }}-${{ env.CI_GITHUB_SHA_SHORT }}
            ${{ env.REGISTRY }}/${{ env.REPO_SOURCE }}/${{ env.PACKAGE }}:latest

      - name: Docker cleanup images
        uses: AtomicFS/delete-package-versions@aacc62ab2e9b522194ec8ace7186d7e25ca543cf
        with:
          package-name: ${{ env.REPO_NAME }}/${{ env.PACKAGE }}
          package-type: 'container'
          min-versions-to-keep: 10
          ignore-versions: '^(latest|v(\d+\.?)+)$'
          ignore-versions-include-tags: 'true'
